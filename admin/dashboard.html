<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sales Dashboard - Outfit Pilihan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    /* Mempermudah blok/sorot teks manual dengan mouse */
    .selectable { user-select: text; -webkit-user-select: text; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!-- Navbar Dashboard -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-indigo-600 text-white font-extrabold text-sm px-2.5 py-1 rounded">OP</span>
        <h1 class="text-base font-bold text-slate-900 tracking-tight">Sales Order Management (Mengantar Ready)</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="fetchOrders()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg border border-slate-300 transition">
          🔄 Refresh Data
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <div>
          <h2 class="text-sm font-bold text-slate-800">Daftar Order Masuk</h2>
          <p class="text-xs text-slate-500">Nama & No HP bisa langsung disorot manual. Gunakan tombol 'Salin Alamat' untuk Mengantar.</p>
        </div>
        <span id="orderCount" class="text-xs font-bold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">
          0 Pesanan
        </span>
      </div>

      <!-- Tabel Order -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 text-slate-600 font-bold uppercase tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3 px-4">Waktu</th>
              <th class="py-3 px-4">Penerima (Sorot)</th>
              <th class="py-3 px-4">No. HP (Sorot)</th>
              <th class="py-3 px-4">Varian / Produk</th>
              <th class="py-3 px-4">Alamat Lengkap</th>
              <th class="py-3 px-4">Tagihan COD</th>
              <th class="py-3 px-4 text-center">Aksi Cepat</th>
            </tr>
          </thead>
          <tbody id="orderTableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="text-center py-8 text-slate-400">Memuat data pesanan...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://cdqcdiykygxxjiflojbp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkcWNkaXlreWd4eGppZmxvamJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjE1NjYsImV4cCI6MjEwNTc5NzU2Nn0.hSMKpRMmyNGNxajxO68Fj7JyDiwEH1IFFuFnEjmiyrE";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Salin Alamat 1-Click
    function copyAddress(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = "✓ Tersalin";
        btn.classList.add("bg-emerald-600", "text-white");
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove("bg-emerald-600", "text-white");
        }, 1500);
      });
    }

    // Salin Format Lengkap Mengantar
    function copyAll(nama, no_hp, alamat, varian, cod) {
      const format = `Nama: ${nama}\nNo HP: ${no_hp}\nAlamat: ${alamat}\nBarang: ${varian}\nTagihan COD: Rp ${Number(cod).toLocaleString('id-ID')}`;
      navigator.clipboard.writeText(format).then(() => {
        alert("Semua data berhasil disalin untuk Mengantar!");
      });
    }

    async function fetchOrders() {
      const tbody = document.getElementById("orderTableBody");
      try {
        const { data, error } = await db
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        // Cek struktur kolom di console browser (F12) untuk kemudahan inspeksi
        console.log("Struktur Order Pertama:", data[0]);

        document.getElementById("orderCount").innerText = `${data.length} Pesanan`;

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Belum ada pesanan masuk.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(order => {
          // Deteksi fleksibel terhadap berbagai kemungkinan penamaan kolom di Supabase
          const nama = order.nama || order.customer_name || order.name || order.full_name || '-';
          const hp = order.no_hp || order.phone || order.whatsapp || order.no_telepon || '-';
          const alamat = order.alamat || order.address || order.alamat_lengkap || '-';
          
          // Deteksi varian produk
          const varian = order.varian || order.variant || order.size || order.ukuran || 
                         (order.paket ? `${order.paket} - ${order.size || ''}` : '') || 
                         order.product_details || order.produk || 'Kaos Senyum Istriku (L)';
          
          const totalCOD = order.total_harga || order.total || order.price || order.tagihan || 99000;
          const cleanPhone = String(hp).replace(/[^0-9]/g, '').replace(/^0/, '62');

          return `
            <tr class="hover:bg-slate-50 transition">
              <!-- Waktu -->
              <td class="py-3 px-4 whitespace-nowrap text-slate-500">
                ${order.created_at ? new Date(order.created_at).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}) : '-'}
              </td>

              <!-- Nama (Bisa disorot manual dengan mudah) -->
              <td class="py-3 px-4 font-semibold text-slate-900 selectable cursor-text">
                ${nama}
              </td>

              <!-- No. HP (Bisa disorot manual + tombol WA) -->
              <td class="py-3 px-4 whitespace-nowrap">
                <div class="flex items-center gap-2">
                  <span class="font-mono text-slate-800 selectable cursor-text">${hp}</span>
                  ${hp !== '-' ? `<a href="https://wa.me/${cleanPhone}?text=Halo\%20kak\%20${encodeURIComponent(nama)},%20konfirmasi%20pesanan%20kaos%20di%20Outfit%20Pilihan%20ya.." target="_blank" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-[10px] font-bold px-1.5 py-0.5 rounded">WA</a>` : ''}
                </div>
              </td>

              <!-- Varian Produk -->
              <td class="py-3 px-4 text-slate-800 font-medium">
                <span class="bg-indigo-50 border border-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-semibold text-[11px] inline-block">
                  ${varian}
                </span>
              </td>

              <!-- Alamat Lengkap + Tombol Copy Khusus -->
              <td class="py-3 px-4 max-w-sm">
                <div class="text-slate-700 leading-snug selectable cursor-text mb-1">
                  ${alamat}
                </div>
                ${alamat !== '-' ? `
                  <button onclick="copyAddress(\`${alamat.replace(/`/g, "\\`")}\`, this)" class="bg-slate-200 hover:bg-slate-300 text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded transition">
                    📋 Salin Alamat
                  </button>
                ` : ''}
              </td>

              <!-- Tagihan COD -->
              <td class="py-3 px-4 whitespace-nowrap font-bold text-slate-950 font-mono">
                Rp ${Number(totalCOD).toLocaleString('id-ID')}
              </td>

              <!-- Aksi Format Mengantar -->
              <td class="py-3 px-4 text-center whitespace-nowrap">
                <button onclick="copyAll(\`${nama.replace(/`/g, "\\`")}\`, \`${hp}\`, \`${alamat.replace(/`/g, "\\`")}\`, \`${varian.replace(/`/g, "\\`")}\`, \`${totalCOD}\`)" class="bg-slate-900 hover:bg-indigo-600 text-white text-[11px] font-semibold px-2.5 py-1.5 rounded-lg transition shadow-sm">
                  Salin Paket
                </button>
              </td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-red-500 font-semibold">Gagal mengambil data: ${err.message}</td></tr>`;
      }
    }

    document.addEventListener("DOMContentLoaded", fetchOrders);
  </script>
</body>
</html>
