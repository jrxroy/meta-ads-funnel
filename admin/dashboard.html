<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sales Dashboard - Outfit Pilihan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!-- Navbar Dashboard -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-indigo-600 text-white font-extrabold text-sm px-2.5 py-1 rounded">OP</span>
        <h1 class="text-base font-bold text-slate-900 tracking-tight">Sales Order Management (Mengantar Ready)</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="fetchOrders()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg border border-slate-300 transition">
          🔄 Refresh Data
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <div>
          <h2 class="text-sm font-bold text-slate-800">Daftar Order COD Masuk</h2>
          <p class="text-xs text-slate-500">Klik tombol salin di samping data untuk langsung paste ke Mengantar</p>
        </div>
        <span id="orderCount" class="text-xs font-bold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">
          0 Pesanan
        </span>
      </div>

      <!-- Tabel Order -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 text-slate-600 font-bold uppercase tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3 px-4">Waktu</th>
              <th class="py-3 px-4">Penerima</th>
              <th class="py-3 px-4">No. HP (WhatsApp)</th>
              <th class="py-3 px-4">Detail Produk</th>
              <th class="py-3 px-4">Alamat Lengkap</th>
              <th class="py-3 px-4">Tagihan COD</th>
              <th class="py-3 px-4 text-center">Aksi Mengantar</th>
            </tr>
          </thead>
          <tbody id="orderTableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="text-center py-8 text-slate-400">Memuat data pesanan...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // Inisialisasi Langsung Supabase
    const SUPABASE_URL = "https://cdqcdiykygxxjiflojbp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkcWNkaXlreWd4eGppZmxvamJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjE1NjYsImV4cCI6MjEwNTc5NzU2Nn0.hSMKpRMmyNGNxajxO68Fj7JyDiwEH1IFFuFnEjmiyrE";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fungsi Salin 1-Click
    function copyText(val, btn) {
      navigator.clipboard.writeText(val).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = "✓";
        btn.classList.add("bg-emerald-600", "text-white");
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove("bg-emerald-600", "text-white");
        }, 1200);
      });
    }

    // Fungsi Salin Format Mengantar
    function copyAll(item) {
      const format = `Nama: ${item.nama || '-'}\nNo HP: ${item.no_hp || '-'}\nAlamat: ${item.alamat || '-'}\nProduk: ${item.paket || 'Kaos Senyum Istriku'} (${item.size || 'L'})\nTagihan COD: Rp ${Number(item.total_harga || 99000).toLocaleString('id-ID')}`;
      navigator.clipboard.writeText(format).then(() => {
        alert("Semua data pemesan berhasil disalin untuk Mengantar!");
      });
    }

    async function fetchOrders() {
      const tbody = document.getElementById("orderTableBody");
      try {
        const { data, error } = await db
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        document.getElementById("orderCount").innerText = `${data.length} Pesanan`;

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Belum ada pesanan masuk.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(order => {
          const totalCOD = order.total_harga || 99000;
          return `
            <tr class="hover:bg-slate-50 transition">
              <td class="py-3 px-4 whitespace-nowrap text-slate-500">
                ${new Date(order.created_at).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'})}
              </td>
              <td class="py-3 px-4">
                <div class="flex items-center gap-1.5 font-semibold text-slate-900">
                  <span>${order.nama || '-'}</span>
                  <button onclick="copyText('${order.nama || ''}', this)" title="Copy Nama" class="text-[10px] bg-slate-200 hover:bg-slate-300 px-1.5 py-0.5 rounded transition">📋</button>
                </div>
              </td>
              <td class="py-3 px-4">
                <div class="flex items-center gap-1.5 font-mono text-slate-800">
                  <span>${order.no_hp || '-'}</span>
                  <button onclick="copyText('${order.no_hp || ''}', this)" title="Copy No HP" class="text-[10px] bg-slate-200 hover:bg-slate-300 px-1.5 py-0.5 rounded transition">📋</button>
                  <a href="https://wa.me/${String(order.no_hp || '').replace(/^0/, '62')}?text=Halo%20kak%20${encodeURIComponent(order.nama || '')},%20konfirmasi%20pesanan%20kaos%20di%20Outfit%20Pilihan%20ya.." target="_blank" class="text-[10px] bg-emerald-100 hover:bg-emerald-200 text-emerald-700 px-1.5 py-0.5 rounded font-bold">WA</a>
                </div>
              </td>
              <td class="py-3 px-4 text-slate-700 font-medium">
                ${order.paket || '1 Pcs'} (${order.size || 'L'})
              </td>
              <td class="py-3 px-4 max-w-xs">
                <div class="flex items-start gap-1.5">
                  <span class="truncate block text-slate-600" title="${order.alamat || ''}">${order.alamat || '-'}</span>
                  <button onclick="copyText('${(order.alamat || '').replace(/'/g, "\\'")}', this)" title="Copy Alamat" class="shrink-0 text-[10px] bg-slate-200 hover:bg-slate-300 px-1.5 py-0.5 rounded transition">📋</button>
                </div>
              </td>
              <td class="py-3 px-4 whitespace-nowrap">
                <div class="flex items-center gap-1.5 font-bold text-slate-900">
                  <span>Rp ${Number(totalCOD).toLocaleString('id-ID')}</span>
                  <button onclick="copyText('${totalCOD}', this)" title="Copy Tagihan COD" class="text-[10px] bg-slate-200 hover:bg-slate-300 px-1.5 py-0.5 rounded transition">📋</button>
                </div>
              </td>
              <td class="py-3 px-4 text-center whitespace-nowrap">
                <button onclick='copyAll(${JSON.stringify(order)})' class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-[11px] font-bold px-2.5 py-1.5 rounded-lg transition">
                  Copy Semua
                </button>
              </td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-red-500 font-semibold">Gagal mengambil data: ${err.message}</td></tr>`;
      }
    }

    document.addEventListener("DOMContentLoaded", fetchOrders);
  </script>
</body>
</html>
