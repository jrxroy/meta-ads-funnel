<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Sales Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-sm w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-blue-600 text-white font-bold rounded-xl flex items-center justify-center mx-auto mb-2 text-xl">
        ⚡
      </div>
      <h1 class="text-xl font-black text-slate-800">Admin Sales Login</h1>
      <p class="text-xs text-slate-400 mt-1">Masukkan kredensial Supabase Auth Anda</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email</label>
        <input type="email" id="email" required placeholder="admin@domain.com"
          class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" id="btnLogin"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        Masuk Dashboard
      </button>
    </form>
    <div id="errMsg" class="text-red-500 text-xs mt-3 text-center hidden"></div>
  </div>

  <script>
    // Cek jika sudah login, langsung lempar ke dashboard
    sbClient.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const err = document.getElementById('errMsg');
      btn.innerText = 'Memverifikasi...';
      btn.disabled = true;
      err.classList.add('hidden');

      const { data, error } = await sbClient.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });

      if (error) {
        err.innerText = error.message;
        err.classList.remove('hidden');
        btn.innerText = 'Masuk Dashboard';
        btn.disabled = false;
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
